name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  offline-checks:
    name: Offline checks (Python 3.11)
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install uv and Python
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          python-version: "3.11"

      - name: Install locked dependencies
        run: uv sync --locked --all-groups

      - name: Validate synthetic dataset
        run: uv run turnwise validate --dataset data/examples

      - name: Run tests
        run: uv run pytest
