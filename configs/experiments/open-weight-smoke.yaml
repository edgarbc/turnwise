experiment:
  id: repair-intake-open-weight-smoke
  version: "0.1.0"
  status: prepared_runtime_verification_required
  purpose: mechanics_smoke_only
  description: Verify pretrained loading, decision-head training, checkpoint save/reload, and Turnwise option-compatible inference; do not treat smoke metrics as model-quality evidence.
  references:
    unsloth_decision_guide: https://unsloth.ai/docs/basics/train-your-own-decision-model-with-unsloth
    model_card: https://huggingface.co/unsloth/Qwen3.5-0.8B

task:
  path: configs/tasks/repair-intake.yaml
  id: repair_intake
  version: "0.1.0"
  sha256: 2bcfeac17ccd30d85c640394b930bfd9db4a4dc7b1b67f049483ab79b9284db3

dataset:
  jsonl_path: data/training/exports/initial-training.jsonl
  metadata_path: data/training/exports/initial-training.metadata.json
  row_count: 8
  split: training
  jsonl_sha256: 58b4d8e6fc8f43dccb551a2276988ba5871eeee097dce74772d0ea0f9fedd415
  metadata_sha256: 3fbbf9843eb766c7556c1663d2e9849dc52ccce26d1f7f3b5845a9e7c5b6c293
  use_for_quality_metrics: false
  final_test_access: false

model:
  repository: unsloth/Qwen3.5-0.8B
  revision: 23c69c53358a07516b5827588b3fdb12ae78fd65
  license: Apache-2.0
  task: decision_model
  decision_head: newly_initialized

training:
  load_in_4bit: true
  max_seq_length: 2048
  lora:
    rank: 16
    alpha: 16
    dropout: 0.0
    gradient_checkpointing: unsloth
  learning_rate: 0.0002
  head_learning_rate: 0.0001
  max_steps: 3
  per_device_train_batch_size: 1
  gradient_accumulation_steps: 1
  warmup_steps: 0
  seed: 3407
  report_to: none

runtime:
  preferred_platform: google_colab
  fallback_platform: kaggle
  preferred_notebook: https://colab.research.google.com/github/unslothai/notebooks/blob/main/nb/Qwen3_5_%284B%29-Decision.ipynb
  required_accelerator: nvidia_gpu
  record_actual_gpu_and_vram: true
  local_core_training_available: false

outputs:
  checkpoint_directory: outputs/repair-intake-open-weight-smoke
  persist_predictions: false
  persist_per_example_metrics: false
  smoke_acceptance:
    - load_pinned_pretrained_backbone
    - produce_option_keys_available_for_a_training_row
    - complete_three_training_steps
    - save_and_reload_adapter_and_decision_head
    - produce_valid_option_keys_after_reload
