[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "turnwise"
version = "0.1.0"
description = "Structured information extraction from conversations"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "openai==3.29.0",
    "python-dotenv>=1.0,<2.0",
    "PyYAML>=6.0,<7.0",
    "typesafe-sdk==0.7.4",
    "typer>=0.12,<1.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0,<9.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[project.scripts]
turnwise = "turnwise.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/turnwise"]